<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピックルボール マッチング</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2a9d8f">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ピックルマッチ">
    <style>
        :root {
            --primary-color: #2a9d8f;
            --secondary-color: #264653;
            --bg-color: #f4f9f9;
            --card-bg: #ffffff;
            --disabled-color: #cccccc;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;   /* ★要素を横ではなく、上から下へ縦並びにする */
            align-items: center;       /* ★左右の中央に寄せる */
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            gap: 16px;                 /* ★縦の隙間をあける */
        }

        .app-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(42, 157, 143, 0.15);
            width: 100%;
            max-width: 540px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .radio-group { display: flex; gap: 10px; margin-bottom: 6px; }
        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background-color: var(--bg-color);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s;
        }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label {
            border-color: var(--primary-color);
            background-color: rgba(42, 157, 143, 0.1);
            color: var(--primary-color);
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            -webkit-appearance: none;
            appearance: none; /* ★標準プロパティを追加して警告を修正 */
        }
        input:disabled, .radio-group.disabled .radio-label {
            background-color: #f0f0f0;
            color: #999;
            cursor: not-allowed;
            border-color: transparent;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:disabled { background-color: var(--disabled-color); }
        .after-match-section {
            display: none;
            border-top: 2px dashed var(--primary-color);
            margin-top: 20px;
            padding-top: 20px;
        }
        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }
        .btn-danger { background-color: #e63946; color: white; margin-bottom: 0; }
        .btn-reset { background-color: #6c757d; color: white; }
        .input-with-btn { display: flex; gap: 8px; }
        .input-with-btn input { flex: 1; }
        .input-with-btn .btn { width: auto; padding: 12px 18px; margin-bottom: 0; }
        
        .status-summary {
            font-size: 14px;
            font-weight: bold;
            color: var(--secondary-color);
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
        }
        .court-container { margin-top: 20px; }
        .court-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: #eef8f6;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary-color);
        }
        .court-info { font-size: 15px; font-weight: bold; flex: 1; }
        .btn-action {
            color: white;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            min-width: 100px;
            text-align: center;
        }
        .btn-finish-mode { background-color: #e76f51; }
        .btn-next-mode { background-color: #2a9d8f; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Nine Draw Maker</h1>

    <div class="form-group">
        <label>モード選択</label>
        <div class="radio-group" id="mode-group">
            <input type="radio" id="mode1" name="mode" value="1" onchange="updateLabels()">
            <label for="mode1" class="radio-label">ペア固定</label>
            <input type="radio" id="mode2" name="mode" value="2" checked onchange="updateLabels()">
            <label for="mode2" class="radio-label">ペアランダム</label>
        </div>
    </div>

    <div class="form-group">
        <label id="count-label">参加者数</label>
        <input type="number" id="participant-count" min="1" value="17">
    </div>

    <div class="form-group">
        <label>使用コート数</label>
        <input type="number" id="court-count" min="1" value="3">
    </div>

    <button class="btn btn-primary" id="match-btn" onclick="executeMatching()">マッチング</button>

    <div class="after-match-section" id="after-match-section">
        <div class="status-summary" id="status-summary">現在の空きコート数: 0面</div>
        <button class="btn btn-reset" id="reset-btn" onclick="resetApp()">リセット</button>
        <button class="btn btn-outline" id="add-btn" onclick="addParticipant()">参加者追加</button>

        <div class="form-group" style="margin-top: 16px;">

        <!-- ★ここから：一時休み・復帰機能を追加（要望） -->
        <div class="form-group" style="margin-top: 16px;">
            <label>一時休み・復帰（番号を入力）</label>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                <!-- 番号入力欄（左側の余白を埋めるため自動伸縮） -->
                <input type="number" id="rest-id" min="1" placeholder="例: 3" style="flex: 1; height: 60px;">
                
                <!-- 横並びに配置される固定サイズの縦書きボタン2つ -->
                <div style="display: flex; gap: 6px; width: 96px; min-width: 96px; flex-shrink: 0;">
                    <button class="btn-action" id="btn-rest-pause" style="background-color: #f4a261; color: white; font-size: 13px; padding: 0px; width: 45px; min-width: 45px; height: 60px; min-height: 60px; writing-mode: vertical-rl; text-orientation: upright; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="pauseParticipant()">休み</button>
                    <button class="btn-action" id="btn-rest-resume" style="background-color: #2a9d8f; color: white; font-size: 13px; padding: 0px; width: 45px; min-width: 45px; height: 60px; min-height: 60px; writing-mode: vertical-rl; text-orientation: upright; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="resumeParticipant()">復帰</button>
                </div>
            </div>
            <!-- お休み中のメンバーを小さく表示する行 -->
            <div id="resting-list-display" style="font-size: 12px; color: #e76f51; margin-top: 6px; font-weight: bold; min-height: 18px;">
                お休み中: なし
            </div>
        </div>
        <!-- ★ここまで -->

          
            <label>参加者減少（削除する番号を入力）</label>
            <div class="input-with-btn">
                <input type="number" id="remove-id" min="1" placeholder="例: 5">
                <button class="btn btn-danger" id="remove-btn" onclick="removeParticipant()">削除</button>
            </div>
        </div>

        <div class="court-container" id="court-display-area"></div>
    </div>
</div>
  
<!-- ★アプリの枠内の最下部に履歴エリアを配置 -->
        <div style="margin-top: 25px; border-top: 2px dashed var(--primary-color); padding-top: 15px;">
            <h3 style="margin-top: 0; font-size: 15px; color: var(--secondary-color); padding-bottom: 6px; font-weight: bold;">
                対戦履歴（メモ）
            </h3>
            <div id="match-history-log" style="font-size: 14px; line-height: 1.6; color: #555; max-height: 160px; overflow-y: auto; font-family: monospace;">
                <span style="color: #999;">（まだ履歴はありません）</span>
            </div>
<script>

    // グローバル変数の宣言
    /** @type {any[]} */
    let players = [];
    /** @type {number} */
    let initialCount = 0; 
    /** @type {number} */
    let globalCourtCount = 0; 
    /** @type {any[]} */
    let activeCourts = []; 
    /** @type {any[]} */
    let courtPlayers = [];

    /** @returns {void} */
    function updateLabels() {
        const modeElement = /** @type {HTMLInputElement} */ (document.querySelector('input[name="mode"]:checked'));
        const mode = modeElement.value;
        const countLabel = document.getElementById('count-label');
        if (countLabel) {
            countLabel.textContent = (mode === "1") ? "ペア数" : "参加者数";
        }
    }

   
// 初回マッチング実行（自動選出関数を残したまま、手動選択プルダウンで起動する版）
    /** @returns {void} */
    function executeMatching() {
        const countInput = /** @type {HTMLInputElement} */ (document.getElementById('participant-count'));
        const courtInput = /** @type {HTMLInputElement} */ (document.getElementById('court-count'));
        const matchBtn = /** @type {HTMLButtonElement} */ (document.getElementById('match-btn'));
        const mode1 = /** @type {HTMLInputElement} */ (document.getElementById('mode1'));
        const mode2 = /** @type {HTMLInputElement} */ (document.getElementById('mode2'));
        const modeGroup = document.getElementById('mode-group');
        const afterMatchSection = document.getElementById('after-match-section');

        initialCount = parseInt(countInput.value) || 0;
        globalCourtCount = parseInt(courtInput.value) || 0;
        if (initialCount > 0 && globalCourtCount > 0){
          for (let cnt = 0; cnt < globalCourtCount; cnt++)
          courtPlayers[cnt] = [];
        }else{
          return alert("1以上の数値を入力してください。");
        }

        if (players.length === 0) {
            for (let i = 1; i <= initialCount; i++) {
                players.push([
                    i,      // [0] プレイヤー番号
                    0,      // [1] 連続戦数
                    0,      // [2] 連続休憩数
                    0,      // [3] 総戦数
                    0,      // [4] 総休憩数
                    0,      // [5] 対戦中コート
                    [],     // [6] ペア履歴
                    [],     // [7] 対戦相手履歴
                    false,  // [8] 削除フラグ
                    0,      // [9] ペア回数
                    0,      // [10] 対戦回数
                    i,      // [11] 元指標
                    false   // [12] 一時お休みフラグ（手動プルダウン自動除外用に使用）
                ]);
            }
        }

        countInput.disabled = courtInput.disabled = true;
        if (matchBtn) matchBtn.disabled = true;
        if (mode1) mode1.disabled = true;
        if (mode2) mode2.disabled = true;
        if (modeGroup) modeGroup.classList.add('disabled');
        if (afterMatchSection) afterMatchSection.style.display = 'block';

        // 🌟【ここをハック】
        // ファイル内にある generateNextMatch などのプログラムは一切消さずに残したまま、
        // 初期の画面表示だけを「waiting（対戦待ち＝手動プルダウン選択枠）」に設定します。
        activeCourts = [];
        for (let c = 0; c < globalCourtCount; c++) {
            activeCourts[c] = { status: "waiting", playerIds: null };
        }
        
        checkAndRefreshRestingPlayers();
        
        // 手動プルダウン付きのコート枠を画面に描画します
        renderCourts();
        
        // 画面下のリアルタイム集計テーブルも表示
        //if (typeof showDebugStatus === "function") {
        //    showDebugStatus();
        //}
    }

    /** 
     * @param {number} courtNum
     * @returns {any[] | null}
     */
    function generateNextMatch(courtNum) {
        const modeElement = /** @type {HTMLInputElement} */ (document.querySelector('input[name="mode"]:checked'));
        const mode = modeElement.value;
        return (mode === "1") ? generatePairFixedMatch(courtNum) : generatePairRandomMatch(courtNum);
    }

    // 空きコート数が0になった瞬間に待機組のステータスを一括更新
    /** @returns {void} */
    function checkAndRefreshRestingPlayers() {
        let playingCount = activeCourts.filter(/** @param {any} c */ (c) => c && c.status === "playing").length;
        let disabledCount = activeCourts.filter(/** @param {any} c */ (c) => c && c.status === "disabled").length;
        let effectiveCourtCount = globalCourtCount - disabledCount;

        if (effectiveCourtCount > 0 && effectiveCourtCount === playingCount) {
            for (let i = 0; i < players.length; i++) {
                if (players[i][5] === 0 && players[i][8] === false) { 
                    players[i][1] = 0;   
                    players[i][2]++;     
                    players[i][4]++;     
                }
            }
        }
    }

    // 【ペア固定モード】
    /** 
     * @param {number} courtNum
     * @returns {any[] | null}
     */
    function generatePairFixedMatch(courtNum) {
        let available = [];
        for (let i = 0; i < players.length; i++) {
          if (players[i][8] === false && players[i][5] === 0 && players[i][12] !== true) {
            available.push(players[i]);
          }
        }
        if (available.length < 2) return null;

        let p1 = null;
        for ( let p1cnt = 0; p1cnt < 2; p1cnt++ ){
          for (let j = 0; j < available.length; j++) {
            if(courtPlayers[courtNum-1].length <= 0 || p1cnt === 1){
              p1 = available[j][0];
              break;
            }
            if (!courtPlayers[courtNum-1].includes(available[j][0]))  {
              p1 = available[j][0];
              break;
            }
          }
        }

        let p2 = null;
        for(let p2cnt=0; p2cnt<2; p2cnt++ ){
          if(p2 !== null) break;
          for (let j = 0; j < available.length; j++) {
            let p2_candidate = available[j][0];
            if (p2_candidate === p1) continue;
            if(p2cnt === 0){
              if (courtPlayers[courtNum-1].includes(p2_candidate) && available[j][1] > 1) continue;
            }
            if (!available[j][7].includes(p1)) {
              p2 = p2_candidate;
              break;
            }else{
              let opponentCount = available[j][7].filter(/** @param {any} v */ (v) => v === p1).length;
              available[j][10] = opponentCount;
            }
          }
          if (p2 === null) {
            available.sort((a, b) => a[10] - b[10] || a[11] - b[11]);
            for (let j = 0; j < available.length; j++) {
              let p2_candidate = available[j][0];
              if (p2_candidate === p1) continue;
              if(p2cnt === 0){
                if (courtPlayers[courtNum-1].includes(p2_candidate) && available[j][1] > 1) continue;
              }
              p2 = p2_candidate;
              break;
            }
            available.sort((a, b) => a[11] - b[11]);
          }
        }

        let confirmed = [p1, p2];
        courtPlayers[courtNum-1] = confirmed;
        updatePlayerStats(confirmed, true, courtNum);
        return [p1, p2, 0, 0];
    }
    // 【ペアランダムモード】3段階緩和数珠つなぎロジック
    /** 
     * @param {number} courtNum
     * @returns {any[] | null}
     */
    function generatePairRandomMatch(courtNum) {
        let available = [];
        for (let i = 0; i < players.length; i++) {
            if (players[i][8] === false && players[i][5] === 0 && players[i][12] !== true) {
                available.push(players[i]);
            }
        }
        if (available.length < 4) return null;

        let p1 = null;
        // ① 最初のプレイヤー（P1）を選出
        for (let p1cnt = 0; p1cnt < 2; p1cnt++) {
            if (p1 !== null) break;

            for (let j = 0; j < available.length; j++) {
              if (courtPlayers[courtNum-1].length <= 0 || p1cnt === 1) {
                  p1 = available[j][0];
                  break;
              }
              if (!courtPlayers[courtNum-1].includes(available[j][0])) {
                  p1 = available[j][0];
                  break;
              }
           }
        }
  
        // ② ①の相方ペア（P2）を決める
        let p2 = null;
        for (let p2cnt = 0; p2cnt < 2; p2cnt++) {
          if (p2 !== null) break;
          for (let j = 0; j < available.length; j++) {
            let p2_candidate = available[j][0];
            if (p2_candidate === p1) continue;
            if (p2cnt === 0) {
              if (courtPlayers[courtNum-1].includes(p2_candidate) && available[j][1] > 1) continue;
            }
            if (!available[j][6].includes(p1) && !available[j][7].includes(p1)) {
              p2 = p2_candidate;
              break;
            }
          }

          // 対象なしのとき (2) ペア履歴に存在しない相手をスキャン
          if (p2 === null) {
            let pairCount = 0;
            let opponentCount = 0;
            for (let j = 0; j < available.length; j++) {
              let p2_candidate = available[j][0];
              if (p2_candidate === p1) continue;
              if (p2cnt === 0) {
                if (courtPlayers[courtNum-1].includes(p2_candidate) && available[j][1] > 1) continue;
              }
              if (!available[j][6].includes(p1)) {
                p2 = p2_candidate;
                break;
              } else {
                pairCount = available[j][6].filter(/** @param {any} v */ (v) => v === p1).length;
                opponentCount = available[j][7].filter(/** @param {any} v */ (v) => v === p1).length;
                available[j][9] = pairCount;
                available[j][10] = opponentCount;
              }
            }
          }
          // 対象なしのとき (3) ソート
          if (p2 === null) {
            available.sort((a, b) => a[9] - b[9] || a[10] - b[10] || a[11] - b[11]);
            for (let j = 0; j < available.length; j++) {
              let p2_candidate = available[j][0];
              if (p2_candidate === p1) continue;
              if (p2cnt === 0) {
                if (courtPlayers[courtNum-1].includes(p2_candidate) && available[j][1] > 1) continue;
              }
              p2 = p2_candidate;
              break;
            }
            available.sort((a, b) => a[11] - b[11]);
          }
        }
    
        // ③ ①の対戦相手（P3）を決める
        let p3 = null;
        for (let p3cnt = 0; p3cnt < 2; p3cnt++) {
          if (p3 !== null) break;
          for (let j = 0; j < available.length; j++) {
            let p3_candidate = available[j][0];
            if (p3_candidate === p1 || p3_candidate === p2) continue;
            if (p3cnt === 0) {
              if (courtPlayers[courtNum-1].includes(p3_candidate) && available[j][1] > 1) continue;
            }
            if (!available[j][6].includes(p1) && !available[j][7].includes(p1) && !available[j][6].includes(p2) && !available[j][7].includes(p2)) {
                p3 = p3_candidate;
                break;
            } else {
              let pairCount = available[j][6].filter(/** @param {any} v */ (v) => v === p1 || v === p2).length;
              let opponentCount = available[j][7].filter(/** @param {any} v */ (v) => v === p1 || v === p2).length;
              available[j][9] = pairCount;
              available[j][10] = opponentCount;
            }
          }
          if (p3 === null) {
            available.sort((a, b) => a[10] - b[10] || a[9] - b[9] || a[11] - b[11]);
            for (let j = 0; j < available.length; j++) {
              let p3_candidate = available[j][0];
              if (p3_candidate === p1 || p3_candidate === p2) continue;
              if (p3cnt === 0) {
                if (courtPlayers[courtNum-1].includes(p3_candidate) && available[j][1] > 1) continue;
              }
              p3 = p3_candidate;
            }
            available.sort((a, b) => a[11] - b[11]);
          }
        }

        // ④ ③の相方ペア（P4）を決める
        let p4 = null;
        for (let p4cnt = 0; p4cnt < 2; p4cnt++) {
          if (p4 !== null) break;
          for (let j = 0; j < available.length; j++) {
            let p4_candidate = available[j][0];
            if (p4_candidate === p1 || p4_candidate === p2 || p4_candidate === p3) continue;
            if (p4cnt === 0) {
              if (courtPlayers[courtNum-1].includes(p4_candidate) && available[j][1] > 1) continue;
            }
            if (!available[j][6].includes(p1) && !available[j][7].includes(p1) && !available[j][6].includes(p2) && !available[j][7].includes(p2) && !available[j][6].includes(p3) && !available[j][7].includes(p3)) {
              p4 = p4_candidate;
              break;
            }
          }
            
          if (p4 === null) {
            for (let j = 0; j < available.length; j++) {
              let p4_candidate = available[j][0];
              if (p4_candidate === p1 || p4_candidate === p2 || p4_candidate === p3) continue;
              if (p4cnt === 0) {
                if (courtPlayers[courtNum-1].includes(p4_candidate) && available[j][1] > 1) continue;
              }
              if (!available[j][6].includes(p3)) {
                p4 = p4_candidate;
                break;
              } else {
                let pairCount = available[j][6].filter(/** @param {any} v */ (v) => v === p3).length;
                let opponentCount = available[j][7].filter(/** @param {any} v */ (v) => v === p1 || v === p2 || v === p3).length;
                available[j][9] = pairCount;
                available[j][10] = opponentCount;
              }
            }
          }

          if (p4 === null) {
            available.sort((a, b) => a[9] - b[9] || a[10] - b[10] || a[11] - b[11]);
            for (let j = 0; j < available.length; j++) {
              let p4_candidate = available[j][0];
              if (p4_candidate === p1 || p4_candidate === p2 || p4_candidate === p3) continue;
              if (p4cnt === 0) {
                if (courtPlayers[courtNum-1].includes(p4_candidate) || available[j][1] > 1) continue;
              }
              p4 = p4_candidate;
              break;
            }
            available.sort((a, b) => a[11] - b[11]);
          }
        }

        let confirmed = [p1, p2, p3, p4];
        courtPlayers[courtNum-1] = confirmed;
        updatePlayerStats(confirmed, false, courtNum);
        return confirmed;
    }

    // 各種戦数・コート番号・履歴を共通更新する関数
    /** 
     * @param {any[]} confirmed
     * @param {boolean} isFixedMode
     * @param {number} courtNum
     * @returns {void}
     */
    function updatePlayerStats(confirmed, isFixedMode, courtNum) {
        let p1 = confirmed[0], p2 = confirmed[1];
        let p3 = isFixedMode ? 0 : confirmed[2], p4 = isFixedMode ? 0 : confirmed[3];

        for (let i = 0; i < players.length; i++) {
            let pid = players[i][0];
            if (!confirmed.includes(pid)) continue;

            players[i][5] = courtNum; 
            players[i][1]++;          
            players[i][3]++;          
            players[i][2] = 0;        

            if (isFixedMode) {
                players[i][7].push(p2);
                if (pid === p2) { players[i][7][players[i][7].length - 1] = p1; }
            } else {
                if (pid === p1) { players[i][6].push(p2); players[i][7].push(p3, p4); }
                else if (pid === p2) { players[i][6].push(p1); players[i][7].push(p3, p4); }
                else if (pid === p3) { players[i][6].push(p4); players[i][7].push(p1, p2); }
                else if (pid === p4) { players[i][6].push(p3); players[i][7].push(p1, p2); }
            }
        }
    }

            const courtState = activeCourts[c];

    // 「試合終了」が押された時の処理
    /** 
     * @param {number} courtNum
     * @returns {void}
     */
    function clickFinish(courtNum) {
        let targetIndex = courtNum - 1;
        let matchPlayers = [];
        let remainingPlayers = [];
//
const courtState = activeCourts[targetIndex];
        if (courtState && courtState.status === "playing") {
            const modeElement = /** @type {HTMLInputElement} */ (document.querySelector('input[name="mode"]:checked'));
            const mode = modeElement.value;
            let matchData = courtState.playerIds;
            let matchText = "";

            if (mode === "1") {
                matchText = `P${matchData[0]} vs P${matchData[1]}`;
            } else {
                matchText = `${matchData[0]}.${matchData[1]} vs ${matchData[2]}.${matchData[3]}`;
            }

            const historyLog = document.getElementById('match-history-log');
            if (historyLog) {
                // 初回（「まだ履歴はありません」の文字があるとき）は中身をクリア
                if (historyLog.innerHTML.includes('まだ履歴はありません')) {
                    historyLog.innerHTML = "";
                }
                // 現在の時刻を取得（お好みで追加）
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                
                // 履歴を上から順番に追加（フォーカスは移動しません）
                historyLog.innerHTML += `[${timeStr}] C${courtNum} : ${matchText}<br>`;
            }
        }
      
//
        for (let i = 0; i < players.length; i++) {
            if (players[i][5] === courtNum) {
                matchPlayers.push(players[i]);
            } else {
                remainingPlayers.push(players[i]);
            }
        }

        for (let i = 0; i < matchPlayers.length; i++) {
            matchPlayers[i][5] = 0;
        }

        matchPlayers.sort((a, b) => a[3] - b[3]);
        players = remainingPlayers.concat(matchPlayers);
        for (let i = 0; i < players.length; i++) {
            players[i][11] = i; 
        }

        activeCourts[targetIndex] = { status: "waiting", playerIds: null };
        renderCourts();
    }

    // 「次の対戦」が押された時の処理
    /** 
     * @param {number} courtIndex
     * @returns {void}
     */
    function clickNextMatch(courtIndex) {
        let courtNum = courtIndex + 1;
        let nextMatch = generateNextMatch(courtNum);

        if (nextMatch) {
            activeCourts[courtIndex] = { status: "playing", playerIds: nextMatch };
        } else {
            activeCourts[courtIndex] = { status: "empty", playerIds: null };
        }

        checkAndRefreshRestingPlayers();
        renderCourts(); 
    }
    // 参加者追加ボタン
    /** @returns {void} */
    function addParticipant() {
        if (players.length === 0) return alert("マッチングを開始してから追加してください。");

        let maxPlayer = players.reduce((max, p) => p[0] > max[0] ? p : max, players[0]);
        let maxId = maxPlayer[0];
        let newId = maxId + 1; 

        let newPlayerData = [
            newId, 0, 0, 0, 0, 0, [], [], false, 0, 0, newId
        ];

        if (maxPlayer[3] === 0) {
            let maxIndex = players.findIndex(p => p[0] === maxId);
            players.splice(maxIndex + 1, 0, newPlayerData);
            alert(`${newId}番を追加しました（まだ未対戦の人がいるため、${maxId}番の後ろに並びました）`);
        } else {
            players.unshift(newPlayerData);
            alert(`${newId}番を追加しました（全員プレイ済みのため、先頭の最優先枠に入りました）`);
        }
        
        for (let c = 0; c < globalCourtCount; c++) {
            if (activeCourts[c] && activeCourts[c].status === "empty") {
                let nextMatch = generateNextMatch(c + 1);
                if (nextMatch) activeCourts[c] = { status: "playing", playerIds: nextMatch };
            }
        }
        
        checkAndRefreshRestingPlayers();
        renderCourts(); 
    }

    // 参加者減少
    /** @returns {void} */
    function removeParticipant() {
        const removeInput = /** @type {HTMLInputElement} */ (document.getElementById('remove-id'));
        const removeId = parseInt(removeInput.value);

        if (!removeId) return alert("番号を入力してください。");

        let found = false;
        for (let i = 0; i < players.length; i++) {
            if (players[i][0] === removeId && players[i][5] === 0) {
                players[i][8] = true; 
                found = true;
                break;
            }
        }
        if (found) {
            alert(`${removeId}番の参加者を削除しました。`);
        } else {
            alert(`${removeId}番は存在しません、または試合中です`);
        }
        removeInput.value = '';
        updateRestingListDisplay();
        renderCourts();
    }

    // リセット
    /** @returns {void} */
    function resetApp() {
        if (confirm("リセットしますか？")) {
            const participantCount = /** @type {HTMLInputElement} */ (document.getElementById('participant-count'));
            const courtCount = /** @type {HTMLInputElement} */ (document.getElementById('court-count'));
            const matchBtn = /** @type {HTMLButtonElement} */ (document.getElementById('match-btn'));
            const mode1 = /** @type {HTMLInputElement} */ (document.getElementById('mode1'));
            const mode2 = /** @type {HTMLInputElement} */ (document.getElementById('mode2'));
            const modeGroup = document.getElementById('mode-group');
            const removeId = /** @type {HTMLInputElement} */ (document.getElementById('remove-id'));
            const courtDisplayArea = document.getElementById('court-display-area');
            const statusSummary = document.getElementById('status-summary');
            const afterMatchSection = document.getElementById('after-match-section');

            if (participantCount) participantCount.disabled = false;
            if (courtCount) courtCount.disabled = false;
            if (matchBtn) matchBtn.disabled = false;
            if (mode1) mode1.disabled = false;
            if (mode2) mode2.disabled = false;
            if (modeGroup) modeGroup.classList.remove('disabled');

            if (removeId) removeId.value = '';
            players = []; 
            activeCourts = [];
            globalCourtCount = 0;
            if (courtDisplayArea) courtDisplayArea.innerHTML = "";
            if (statusSummary) statusSummary.textContent = "現在の空きコート数: 0面";
            if (afterMatchSection) afterMatchSection.style.display = 'none';
            
            const debugContainer = document.getElementById('debug-container');
            if (debugContainer) debugContainer.remove();
          const historyLog = document.getElementById('match-history-log'); if(historyLog) historyLog.innerHTML = '<span style="color: #999;">（まだ履歴はありません）</span>';
        }

        const restDisp = document.getElementById('resting-list-display'); if(restDisp) restDisp.textContent = 'お休み中: なし';
      
    }

    // コートの「休止/稼働」をリアルタイムに切り替える関数
    /** 
     * @param {number} courtNum
     * @returns {void}
     */
    function toggleCourtActive(courtNum) {
        let targetIndex = courtNum - 1;
        let currentState = activeCourts[targetIndex];

        if (currentState && currentState.status === "disabled") {
            activeCourts[targetIndex] = { status: "waiting", playerIds: null };
            alert(`コート${courtNum} の稼働を再開しました。`);
        } 
        else if (currentState && currentState.status === "playing") {
            alert(`コート${courtNum} は現在試合中です。試合終了を押してから休止してください。`);
            return;
        } 
        else {
            activeCourts[targetIndex] = { status: "disabled", playerIds: null };
            alert(`コート${courtNum} を休止しました。`);
        }

        checkAndRefreshRestingPlayers();
        renderCourts();
    }

              // ★ここから：一時休み・復帰のコントロールロジック（要望）
    /** @returns {void} */
    function pauseParticipant() {
        const input = /** @type {HTMLInputElement} */ (document.getElementById('rest-id'));
        const id = parseInt(input.value);
        if (!id) return alert("番号を入力してください。");

        let found = false;
        for (let i = 0; i < players.length; i++) {
            if (players[i][0] === id) {
                if (players[i][5] > 0) {
                    alert(`${id}番は現在試合中のため、お休みにできません。試合終了後に操作してください。`);
                    return;
                }
                if (players[i][8] === true) {
                    alert(`${id}番はすでに削除されています。`);
                    return;
                }
                players[i][12] = true; // 配列の13番目に「一時休みフラグ」をセット
                found = true;
                break;
            }
        }

        if (found) {
            alert(`${id}番を「お休み」にしました。次のマッチングからスキップされます。`);
            updateRestingListDisplay();
        } else {
            alert(`${id}番のプレイヤーは見つかりませんでした。`);
        }
        input.value = '';
    }

    /** @returns {void} */
    function resumeParticipant() {
        const input = /** @type {HTMLInputElement} */ (document.getElementById('rest-id'));
        const id = parseInt(input.value);
        if (!id) return alert("番号を入力してください。");

        let found = false;
        for (let i = 0; i < players.length; i++) {
            if (players[i][0] === id && players[i][12] === true) {
                players[i][12] = false; // 一時休みフラグを解除
                found = true;
                break;
            }
        }

        if (found) {
            alert(`${id}番が復帰しました！次のマッチングから選出対象に戻ります。`);
            updateRestingListDisplay();
        } else {
            alert(`${id}番はお休み中リストにいないか、存在しません。`);
        }
        input.value = '';
    }
      // お休み中と削除済のプレイヤーをそれぞれ分けて綺麗に並べて表示する処理（拡張版）
    /** @returns {void} */
    function updateRestingListDisplay() {
        const display = document.getElementById('resting-list-display');
        if (!display) return;

        let restingIds = []; // 一時お休み中の人を入れる配列
        let removedIds = []; // 完全に削除された人を入れる配列

        for (let i = 0; i < players.length; i++) {
            // 配列の[8]番目がtrue ➔ 完全に削除されたプレイヤー
            if (players[i][8] === true) {
                removedIds.push(`P${players[i][0]}`);
            }
            // 配列の[12]番目がtrueで、かつ削除されていない ➔ 一時お休み中のプレイヤー
            else if (players[i][12] === true) {
                restingIds.push(`P${players[i][0]}`);
            }
        }

        // 画面に表示する文字列を組み立てる
        let textParts = [];
        
        if (restingIds.length > 0) {
            textParts.push(`お休み中: ${restingIds.join(', ')}`);
        } else {
            textParts.push(`お休み中: なし`);
        }

        if (removedIds.length > 0) {
            textParts.push(`<span style="color: #6c757d; margin-left: 10px;">削除済: ${removedIds.join(', ')}</span>`);
        }

        // HTMLとして画面に差し込む（削除済はグレーの文字で表示されます）
        display.innerHTML = textParts.join(' | ');
    }
